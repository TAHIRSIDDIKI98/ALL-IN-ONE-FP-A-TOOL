    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#42d4b0" stop-opacity="0"/><stop offset="1" stop-color="#42d4b0" stop-opacity=".2"/></linearGradient>
    <linearGradient id="stroke" x1="0" x2="1"><stop stop-color="#74e8ca"/><stop offset="1" stop-color="#30a99b"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#92b9b4" stroke-opacity=".09" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="510" rx="24" fill="url(#bg)"/>
