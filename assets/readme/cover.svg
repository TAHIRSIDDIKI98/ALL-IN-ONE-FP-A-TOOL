<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 510" role="img" aria-labelledby="title desc">
  <title id="title">FP&amp;A Workspace — a clearer view of the numbers</title>
  <desc id="desc">A dark navy and teal editorial cover with abstract financial workbench panels.</desc>
  <defs>
