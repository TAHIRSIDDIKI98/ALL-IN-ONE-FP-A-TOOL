name: OneFP&A CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sandbox-and-e2e:
    name: Sandbox Gates, Build & Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # S-COMMIT (INT8) must see the DEC-007 ancestry boundary; a depth-1 clone fails closed.
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install exact dependencies
        run: npm ci

      - name: Run sandbox verification suite (zero secrets/network)
        env:
          CI: 'true'
        run: |
          set -o pipefail
          npm run verify | tee verify-output.log

      # The raw log host is not reachable from every environment, so promote the failing gate's
      # own lines to check-run annotations just as the E2E step does (§8.9/PR5).
      - name: Publish sandbox gate failure annotations
        if: failure()
        run: node scripts/publish-e2e-failure.mjs verify-output.log

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Spine Harness
        env:
          CI: 'true'
        run: |
          set -o pipefail
          npx playwright test --config=e2e/playwright.config.ts 2>&1 | tee playwright-output.log

      # Artifact download is not reachable from every environment, so on failure the harness
      # promotes its own error lines to check-run annotations, which the REST API can always read.
      - name: Publish E2E failure annotations
        if: failure()
        run: |
          set -o pipefail
          node scripts/publish-e2e-failure.mjs playwright-output.log

      - name: Upload CI diagnostics & test reports (always, including failure — PR5)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            verify-output.log
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  neon-parity:
    name: Neon Migration Parity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.ENABLE_NEON_PARITY == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install exact dependencies
        run: npm ci

      - name: Run PGLite vs Neon schema & query parity gate
        env:
          NEON_PARITY_DATABASE_URL: ${{ secrets.NEON_PARITY_DATABASE_URL }}
        run: npx tsx scripts/schema-parity.ts | tee neon-parity.log

      - name: Upload Neon parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-parity-diagnostics-${{ github.run_id }}
          path: neon-parity.log
          if-no-files-found: warn
          retention-days: 14
